name: Build VEXORA APK

# Jalankan manual: tab Actions -> "Build VEXORA APK" -> Run workflow
# Wajib: Settings -> Secrets and variables -> Actions -> Variables -> VEXORA_API_BASE = https://domain-vercel-kamu.vercel.app
# Opsional (APK rilis bertanda tangan sendiri): secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VEXORA_API_BASE: ${{ vars.VEXORA_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek VEXORA_API_BASE
        run: |
          if [ -z "$VEXORA_API_BASE" ]; then
            echo "::error::Variable VEXORA_API_BASE belum diisi (contoh https://vexora.vercel.app)"; exit 1
          fi

      - name: Siapkan proyek Android
        working-directory: android-apk
        run: |
          npm install
          node scripts/prepare-web.js
          npx cap add android
          node scripts/patch-android.js
          npx capacitor-assets generate --android --iconBackgroundColor "#050506" --splashBackgroundColor "#050506"
          npx cap sync android

      - name: Build APK (debug, langsung bisa dipasang)
        working-directory: android-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VEXORA-v3.0.0-debug.apk"

      - name: Build APK rilis bertanda tangan (jika keystore ada)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android-apk/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vexora.jks"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/vexora.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/VEXORA-v3.0.0-release.apk" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VEXORA-v3.0.0-apk
          path: |
            VEXORA-v3.0.0-debug.apk
            VEXORA-v3.0.0-release.apk
          if-no-files-found: warn
